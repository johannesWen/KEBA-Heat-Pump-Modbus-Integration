name: CI

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  validation:
    uses: ./.github/workflows/hacs.yml
  tests:
    uses: ./.github/workflows/tests.yml
  frontend:
    name: Build frontend card
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build card
        run: npm run build
        working-directory: frontend
      - name: Package and validate release artifact
        run: |
          MANIFEST_VERSION=$(jq -r .version custom_components/keba_heat_pump_modbus/manifest.json)
          python3 .github/scripts/package_release.py \
            --tag "v${MANIFEST_VERSION}" \
            --archive "${RUNNER_TEMP}/keba_heat_pump_modbus.zip"
