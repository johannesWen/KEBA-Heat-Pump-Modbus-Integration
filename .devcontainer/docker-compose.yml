services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspaces/keba:cached
    command: sleep infinity
    depends_on:
      - homeassistant
      - modbus-simulator
    environment:
      HA_URL: http://homeassistant:8123
      HA_DEV_USERNAME: ${HA_DEV_USERNAME:-dev}
      HA_DEV_PASSWORD: ${HA_DEV_PASSWORD:-dev}
